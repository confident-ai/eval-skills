name: Validate skills
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/validate_repo.py
      - run: python -m unittest discover -s tests -v
      - run: python examples/offline_eval.py --output "${RUNNER_TEMP}/eval-skills-example"
      - run: python skills/eval-run/scripts/artifacts.py validate "${RUNNER_TEMP}/eval-skills-example"
